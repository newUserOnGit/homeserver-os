# Home Server OS Configuration

[system]
hostname = homeserver
timezone = UTC
locale = en_US.UTF-8

[network]
interface = eth0
dhcp = true
dns_servers = 8.8.8.8,8.8.4.4

[storage]
default_fs = ext4
raid_level = 1
auto_mount = true

[security]
firewall_enabled = true
ssh_enabled = true
ssh_port = 22

[services]
web_admin_port = 8080
api_port = 8081

[virtualization]
containers_enabled = true
vms_enabled = true
max_containers = 10
max_vms = 5

[monitoring]
log_level = info
metrics_enabled = true
alerts_enabled = true

[backup]
auto_backup = true
backup_schedule = daily
backup_retention = 7
